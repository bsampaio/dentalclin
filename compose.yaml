x-hardening: &hardening
  read_only: true
  tmpfs:
    - /tmp:size=64m
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  pids_limit: 256
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  # Web app. Only reachable from this PC (127.0.0.1); Tailscale Serve/Funnel proxies to it.
  dentalclin:
    <<: *hardening
    build: .
    image: dentalclin:latest
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    ports:
      - "127.0.0.1:8087:8080"
    mem_limit: 1g
    cpus: 2

